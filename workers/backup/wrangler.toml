name = "legacy-hub-backup"
main = "src/index.mjs"
compatibility_date = "2026-07-01"
# No public address: the fetch handler only returns 404, and backups must never be reachable by URL.
workers_dev = false
preview_urls = false

[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "legacy-hub-db"
database_id = "3c06c3cb-e1a6-426c-ad85-0b8c94616ed2"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "legacy-hub-backups"
