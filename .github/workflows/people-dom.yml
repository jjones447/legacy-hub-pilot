name: People Add DOM controls

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dom-controls:
    name: People Add DOM controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked DOM test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise only the local Staff HTML controls
        run: node --test tests/dom/staff-people-add.test.mjs
      - name: Evidence boundary
        if: always()
        run: echo "Local DOM only. No browser, network, layout, workerd or installed acceptance." >> "$GITHUB_STEP_SUMMARY"
