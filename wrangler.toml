# Legacy Caregiver Hub — Cloudflare Pages + D1 (slice 03: deploy-ready, not deployed)
# Tenancy per docs/decisions/0004: Jacob's Cloudflare account; domain onboards once at go-live.
#
# Fill these two values at first deploy:
#   1. account_id — from the Cloudflare dashboard (or `wrangler whoami`)
#   2. database_id — printed by `wrangler d1 create legacy-hub-db` (and the staging one)
# Then: `wrangler d1 execute legacy-hub-db --file=schema/0001_init.sql` and deploy.

name = "legacy-hub"
compatibility_date = "2026-07-01"
pages_build_output_dir = "."

[ai]
binding = "AI"

[[d1_databases]]
binding = "LEGACY_DB"
database_name = "legacy-hub-db"
database_id = "dab02f78-f131-4d17-abaa-db9e6b45fb1b"

# Production uses legacy-hub-db (dab02f78-f131-4d17-abaa-db9e6b45fb1b); preview deployments use legacy-hub-db-staging (2816cb1a-dc45-4550-9817-fda621faecad).
[[env.preview.d1_databases]]
binding = "LEGACY_DB"
database_name = "legacy-hub-db-staging"
database_id = "2816cb1a-dc45-4550-9817-fda621faecad"

# Non-inheritable: preview must restate the Workers AI binding or the staging assistant has no model.
[env.preview.ai]
binding = "AI"


# MEDIA (R2) binding, ADR 0007: enable once the bucket legacy-hub-media exists in the account.
# Declaring it before the bucket exists makes every Pages deploy fail at the Functions step (2026-09-16).
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "legacy-hub-media"
