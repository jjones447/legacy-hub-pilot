# Legacy Caregiver Hub — Cloudflare Pages + D1 (slice 03: deploy-ready, not deployed)
# Tenancy per docs/decisions/0004: Jacob's Cloudflare account; domain onboards once at go-live.
#
# The two deploy values are filled for the production Cloudflare account:
#   1. account_id — the account that already hosts the `legacy-hub` Pages project and its databases
#   2. database_id — the D1 ids below for legacy-hub-db and legacy-hub-db-staging
# Then: `wrangler d1 execute legacy-hub-db --file=schema/0001_init.sql` and deploy.

name = "legacy-hub"
compatibility_date = "2026-07-01"
account_id = "b7b09c66fe896c2b65fada924d3eadc2"
# Deploys serve dist/, built by `npm run build:site` from an allowlist (scripts/build-site.mjs),
# so docs, scripts, schema and tests in this repository are never uploaded as site files.
pages_build_output_dir = "dist"

[ai]
binding = "AI"

[[d1_databases]]
binding = "LEGACY_DB"
database_name = "legacy-hub-db"
database_id = "3c06c3cb-e1a6-426c-ad85-0b8c94616ed2"
migrations_dir = "schema"

# Production uses legacy-hub-db (3c06c3cb-e1a6-426c-ad85-0b8c94616ed2); preview deployments use legacy-hub-db-staging (42be536c-e354-44c7-b246-2dcac18d8ac6).
[[env.preview.d1_databases]]
binding = "LEGACY_DB"
database_name = "legacy-hub-db-staging"
database_id = "42be536c-e354-44c7-b246-2dcac18d8ac6"
migrations_dir = "schema"

# Non-inheritable: preview must restate the Workers AI binding or the staging assistant has no model.
[env.preview.ai]
binding = "AI"


# MEDIA (R2) binding, ADR 0007. COMMENTED OUT 2026-09-29: neither bucket exists in this account
# yet, and a binding to a missing bucket makes every Pages deploy fail at the Functions step
# (2026-09-16). Re-enable BOTH blocks together once `legacy-hub-media` and
# `legacy-hub-media-staging` exist in this account.
#[[r2_buckets]]
#binding = "MEDIA"
#bucket_name = "legacy-hub-media"

# Non-inheritable: preview must restate MEDIA. Preview reads a separate staging bucket,
# matching its separate staging D1, so staging media and manifests never touch production.
#[[env.preview.r2_buckets]]
#binding = "MEDIA"
#bucket_name = "legacy-hub-media-staging"
